task:
  title: Maister Viewer — VS Code plugin as a single view layer over tasks and artifacts
  description: >-
    Maister produces orchestrator-state.yml for each task. Tasks are of different types based on
    workflows, and the process emits HTML files and other artifacts. Build a Visual Studio Code
    plugin that acts as a single layer of view over these tasks and artifacts, per the product
    vision. GitLens is the reference model: the plugin is self-sufficient and delivers all its
    functionality without forcing the user to jump around the VS Code UI.
  status: completed
  tags: [vscode-extension, greenfield, developer-tooling]
  priority: null

