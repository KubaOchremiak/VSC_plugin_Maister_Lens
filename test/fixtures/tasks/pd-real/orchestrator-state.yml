  project_context_summary: >-
    Greenfield VS Code extension. Vision: visual, single-layer access to all Maister flows and
    artifacts for analytically-minded developers who prefer not to dive into code and git; browser
    of completed tasks with search and filter; top-layer view over Maister and repository changes.
    Tech stack is unimplemented but intended: TypeScript, VS Code Extension API (Node.js extension
    host), npm + tsc, ESLint/Prettier planned, distribution via vsce to Marketplace/Open VSX.
